eyebrow: "Jak zamówić"
heading: "Cztery kroki"
headingEm: "od zapytania do dostawy"
lead: "Nie ma tu koszyka ani płatności online. Każde zamówienie ustalamy z Tobą bezpośrednio — tak łatwiej dopasować rośliny do miejsca."
items:
  - title: "Wyślij zapytanie"
    text: "Napisz, czego szukasz, i dołącz zdjęcie wnętrza — łatwiej nam ocenić miejsce i światło."
  - title: "Otrzymaj propozycję"
    text: "Dobieramy rośliny, donice albo gotowy zestaw i odsyłamy Ci propozycję."
  - title: "Ustalamy szczegóły"
    text: "Potwierdzamy dostępność, cenę i termin dostawy — indywidualnie dla Twojego zamówienia."
  - title: "Dostawa"
    text: "Dostarczamy zamówienie pod wskazany adres w ustalonym terminie."
ctaText: "Masz zdjęcie wnętrza? To najlepszy początek rozmowy."
ctaLabel: "Przejdź do formularza"
